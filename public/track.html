<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureHer – Live Trip Tracking</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; height: 100vh; display: flex; flex-direction: column; }

    #header {
      background: linear-gradient(135deg, #6c47ff, #a855f7);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 20px rgba(108,71,255,0.4);
      flex-shrink: 0;
    }
    #header svg { width: 28px; height: 28px; fill: #fff; flex-shrink: 0; }
    #header-text h1 { font-size: 18px; font-weight: 700; }
    #header-text p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

    #status-bar {
      background: #1a1a2e;
      padding: 10px 20px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    #pulse { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; flex-shrink: 0; }
    #pulse.inactive { background: #ef4444; animation: none; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }
    #status-text { font-size: 13px; color: #a3a3a3; }
    #last-updated { margin-left: auto; font-size: 11px; color: #6b6b8a; }

    #map { flex: 1; width: 100%; background: #1a1a2e; }

    #info-panel {
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
      padding: 16px 20px;
      flex-shrink: 0;
    }
    .info-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-icon { font-size: 18px; width: 28px; text-align: center; }
    .info-label { font-size: 11px; color: #6b6b8a; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-value { font-size: 15px; font-weight: 600; color: #e0e0ff; }

    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f0f1a; gap: 16px; z-index: 999;
    }
    .spinner { width: 48px; height: 48px; border: 3px solid #2a2a4a; border-top-color: #6c47ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #a3a3a3; font-size: 14px; }

    #error {
      display: none;
      position: absolute; inset: 0;
      flex-direction: column; align-items: center; justify-content: center;
      background: #0f0f1a; gap: 12px;
    }
    #error.show { display: flex; }
    #error-icon { font-size: 48px; }
    #error p { color: #ef4444; font-size: 16px; text-align: center; max-width: 280px; }
  </style>
</head>
<body>

<div id="header">
  <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
  <div id="header-text">
    <h1>SecureHer Live Tracking</h1>
    <p>Real-time trip monitoring</p>
  </div>
</div>

<div id="status-bar">
  <div id="pulse"></div>
  <span id="status-text">Connecting...</span>
  <span id="last-updated"></span>
</div>

<div id="map"></div>

<div id="info-panel">
  <div class="info-row">
    <span class="info-icon">📍</span>
    <div>
      <div class="info-label">Current Location</div>
      <div class="info-value" id="coords">Waiting for location...</div>
    </div>
  </div>
  <div class="info-row">
    <span class="info-icon">🕐</span>
    <div>
      <div class="info-label">Last Updated</div>
      <div class="info-value" id="time-text">—</div>
    </div>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p>Loading live location...</p>
</div>

<div id="error">
  <div id="error-icon">⚠️</div>
  <p id="error-msg">Trip not found or has ended.</p>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAH4ioId-gjIZXkDU3aNmaDjeDclwXY9p8",
    authDomain: "her-b03d7.firebaseapp.com",
    projectId: "her-b03d7",
    storageBucket: "her-b03d7.firebasestorage.app",
    messagingSenderId: "346182049858",
    appId: "1:346182049858:web:aeab975472fe73dd380ddb"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Get alert ID from URL  
  const params = new URLSearchParams(window.location.search);
  const alertId = params.get('id');

  if (!alertId) {
    showError('No tracking ID provided in the link.');
  } else {
    startTracking(alertId);
  }

  // Leaflet map (OpenStreetMap – no API key)
  const leafletCss = document.createElement('link');
  leafletCss.rel = 'stylesheet';
  leafletCss.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(leafletCss);

  const leafletJs = document.createElement('script');
  leafletJs.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  leafletJs.onload = () => {
    window._leafletReady = true;
    if (window._pendingCoords) initMap(window._pendingCoords.lat, window._pendingCoords.lng);
  };
  document.head.appendChild(leafletJs);

  let map = null;
  let marker = null;

  function initMap(lat, lng) {
    if (map) {
      marker.setLatLng([lat, lng]);
      map.setView([lat, lng], 16);
      return;
    }
    map = L.map('map').setView([lat, lng], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const icon = L.divIcon({
      html: `<div style="
        width:20px;height:20px;
        background:#6c47ff;
        border:3px solid #fff;
        border-radius:50%;
        box-shadow:0 0 0 4px rgba(108,71,255,0.35);
      "></div>`,
      className: '',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });
    marker = L.marker([lat, lng], { icon }).addTo(map).bindPopup('📍 Live Location').openPopup();
  }

  function startTracking(id) {
    const ref = doc(db, 'alerts', id);
    onSnapshot(ref, (snap) => {
      document.getElementById('loading').style.display = 'none';

      if (!snap.exists()) {
        showError('This tracking link is no longer active.');
        return;
      }

      const data = snap.data();
      const active = data.active !== false;

      document.getElementById('pulse').className = active ? '' : 'inactive';
      document.getElementById('status-text').textContent = active
        ? '🟢 Trip in progress'
        : '🔴 Trip has ended';

      // Try `last` field first (updated every GPS ping), fall back to currentLocation
      const loc = data.last || data.currentLocation;
      if (loc && loc.lat && loc.lng) {
        const lat = loc.lat;
        const lng = loc.lng;

        document.getElementById('coords').textContent =
          `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

        const ts = data.last?.timestamp?.toDate?.() || new Date();
        document.getElementById('time-text').textContent = ts.toLocaleTimeString();
        document.getElementById('last-updated').textContent = `Updated ${ts.toLocaleTimeString()}`;

        if (window._leafletReady) {
          initMap(lat, lng);
        } else {
          window._pendingCoords = { lat, lng };
        }
      } else {
        document.getElementById('coords').textContent = 'Awaiting first GPS ping...';
      }
    }, (err) => {
      showError('Could not read location: ' + err.message);
    });
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error').classList.add('show');
  }
</script>

</body>
</html>
